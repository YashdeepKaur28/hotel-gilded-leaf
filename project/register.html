<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Gilded Leaf | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- [BLOCK: NAVIGATION ] -->
    <header class="header-strip">
        <nav class="navbar">
            <div class="logo-brand"><h2>Gilded<span>Leaf</span></h2></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Culinary Menu</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="booking.html">Reservations</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="login.html" class="nav-auth-btn login">Login</a></li>
                <li><a href="register.html" class="nav-auth-btn register active">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- [BLOCK: REGISTER FORM] -->
    <main class="main-wrapper">
        <div class="form-container-box">
            <h2>Create Account</h2>

            <form action="#">

                <!-- Full Name -->
                <div class="input-field-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" required placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div class="input-field-group">
                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email" required placeholder="Enter your email">
                </div>

                <!-- Password -->
                <div class="input-field-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required placeholder="Minimum 8 characters">
                </div>

                <!-- Confirm Password -->
                <div class="input-field-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="Re-enter password">
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-form-btn">Register</button>

                <!-- Footer Link -->
                <p class="form-footer-link">
                    Already have an account? <a href="login.html">Login here</a>
                </p>

            </form>
        </div>
    </main>

</body>
</html>
