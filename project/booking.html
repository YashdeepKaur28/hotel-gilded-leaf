<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Gilded Leaf | Reservations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- [BLOCK: NAVIGATION STRIP] -->
    <header class="header-strip">
        <nav class="navbar">
            <div class="logo-brand"><h2>Gilded<span>Leaf</span></h2></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Culinary Menu</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="booking.html" class="active">Reservations</a></li>
                <li><a href ="reviews.html">Reviews</a></li>
                <li><a href="contact.html">Contact</a><li>
                <li><a href="login.html" class="nav-auth-btn login">Login</a></li>
                <li><a href="register.html" class="nav-auth-btn register">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- [BLOCK: BOOKING FORM] -->
    <main class="main-wrapper">
        <div class="form-container-box">
            <h2>Reserve Your Stay</h2>

            <form action="#">

                <!-- Room Selection -->
                <div class="input-field-group">
                    <label for="room-selection">Select Room Type</label>
                    <select id="room-selection" required>
                        <option value="">Choose a room</option>
                        <option value="deluxe">Deluxe Queen Suite - $150</option>
                        <option value="presidential">Presidential King Suite - $290</option>
                    </select>
                </div>

                <!-- Check-in -->
                <div class="input-field-group">
                    <label for="check-in">Check-In Date</label>
                    <input type="date" id="check-in" required>
                </div>

                <!-- Check-out -->
                <div class="input-field-group">
                    <label for="check-out">Check-Out Date</label>
                    <input type="date" id="check-out" required>
                </div>

                <!-- Guests -->
                <div class="input-field-group">
                    <label for="guests">Number of Guests</label>
                    <input type="number" id="guests" min="1" max="6" required placeholder="Enter guests">
                </div>

                <!-- Special Requests -->
                <div class="input-field-group">
                    <label for="requests">Special Requests</label>
                    <textarea id="requests" rows="3" placeholder="Dietary needs, preferences..."></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-form-btn">Book Now</button>

            </form>
        </div>
    </main>

</body>
</html>
